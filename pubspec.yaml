name: winplus
description: WinPlus  plateforme éducative camerounaise (BEPC → concours grandes écoles).
publish_to: 'none'
version: 3.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  file_picker: ^8.0.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/winplus-logo.png
    - assets/Login.gif
  # Police chargée dynamiquement via google_fonts (Fraunces + Manrope).
